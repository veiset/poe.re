    <script data-cfasync="false" async src="https://s.nitropay.com/ads-2596.js"></script>
    <!-- NitroPay's ad-block detection, verbatim from
         https://nitropay.com/docs/detecting-ad-blocking-users/. Fires the
         np.blocking event that NitroAd listens for to collapse an unfillable slot. -->
    <script data-cfasync="false">
    var npDetect = new (function () {
        this.blocking = false;
        var errcnt = 0;
        function testImg() {
            var i = new Image();
            i.onerror = () => {
                errcnt++;
                if (errcnt < 3) {
                    setTimeout(testImg, 250);
                } else {
                    npDetect.blocking = true;

                    if (document.dispatchEvent && window.CustomEvent) {
                        document.dispatchEvent(
                            new CustomEvent('np.blocking', {
                                detail: {
                                    blocking: npDetect.blocking,
                                },
                            })
                        );
                    }
                }
            };
            i.onload = () => {
                npDetect.blocking = false;
            };

            i.src = 'https://s.nitropay.com/1.gif?' + Math.random() + '&adslot=';
        }
        testImg();
    })();
    </script>
